services:

  pb_backend:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        - PB_VERSION=0.28.2
    container_name: pb_backend
    ports:
      - "8081:8080"
    volumes:
      - ./pb_data:/pb/pb_data
    networks:
      - web1
    restart: unless-stopped 

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: ngrok http pb_backend:8080
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      - web1
    restart: unless-stopped   

networks:
  web1:
    name: web1
