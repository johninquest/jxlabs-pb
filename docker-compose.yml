services:
  pb_backend:
    build:
      context: .
      dockerfile: Dockerfile.base
      args:
        - PB_VERSION=0.28.2
    container_name: pb_backend
    volumes:
      - ./pb_data:/pb/pb_data
      - ./pb_hooks.js:/pb/pb_hooks.js
    networks:
      - proxy
    restart: unless-stopped
    environment:
      POCKETBASE_APP_ENV_ADMIN_EMAIL: ${DB_ADMIN_USER}
      POCKETBASE_APP_ENV_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
      POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pb_backend.rule=Host(`pocketbase.johnapps.de`)"
      - "traefik.http.routers.pb_backend.entrypoints=websecure"
      - "traefik.http.routers.pb_backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.pb_backend.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true